<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Hand-drawn overview of the black-box attack framework</title>
  <desc id="desc">Four-stage framework covering attack setup, target and state construction, a semantic-constrained attack loop, and evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#202124"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#202124"/>
    </marker>
    <style>
      .bg{fill:#fff}.card{fill:#fff;stroke:#202124;stroke-width:4}.mini{fill:#fff;stroke:#202124;stroke-width:3}
      .softBlue{fill:#e7f5ff;stroke:#202124;stroke-width:2.5}.softGreen{fill:#ebfbee;stroke:#202124;stroke-width:2.5}
      .softYellow{fill:#fff3bf;stroke:#202124;stroke-width:2.5}.softPurple{fill:#f3f0ff;stroke:#202124;stroke-width:2.5}
      .title{font:700 30px 'Comic Sans MS','Segoe Print',sans-serif;fill:#202124;text-anchor:middle}
      .heading{font:700 22px 'Comic Sans MS','Segoe Print',sans-serif;fill:#202124;text-anchor:middle}
      .text{font:18px 'Comic Sans MS','Segoe Print',sans-serif;fill:#343a40;text-anchor:middle}
      .small{font:16px 'Comic Sans MS','Segoe Print',sans-serif;fill:#343a40;text-anchor:middle}
      .tiny{font:14px 'Comic Sans MS','Segoe Print',sans-serif;fill:#343a40;text-anchor:middle}
      .step{font:700 19px 'Comic Sans MS','Segoe Print',sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .line{fill:none;stroke:#202124;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:#202124;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .loop{fill:none;stroke:#202124;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowSmall)}
      .node{fill:#fff;stroke:#202124;stroke-width:2.5}.blue{fill:#74c0fc;stroke:#202124;stroke-width:2.5}
      .green{fill:#8ce99a;stroke:#202124;stroke-width:2.5}.yellow{fill:#ffe066;stroke:#202124;stroke-width:2.5}
    </style>
  </defs>

  <rect class="bg" width="1800" height="1000"/>

  <!-- Stage 1: attack setup -->
  <g>
    <rect class="card" x="25" y="260" width="330" height="510" rx="28"/>
    <circle cx="63" cy="298" r="24" fill="#74c0fc" stroke="#202124" stroke-width="2.5"/>
    <text class="step" x="63" y="299">1</text>
    <text class="title" x="195" y="308">Attack Setup</text>

    <text class="heading" x="190" y="356">Test Provenance Graph</text>
    <g transform="translate(82 378)">
      <path class="line" d="M12 60L62 18L113 54L164 10M62 18L81 100L137 92M113 54L137 92L193 56"/>
      <circle class="blue" cx="12" cy="60" r="10"/><circle class="node" cx="62" cy="18" r="10"/>
      <circle class="green" cx="113" cy="54" r="10"/><circle class="node" cx="164" cy="10" r="10"/>
      <circle class="node" cx="81" cy="100" r="10"/><circle class="yellow" cx="137" cy="92" r="10"/>
      <circle class="node" cx="193" cy="56" r="10"/>
    </g>

    <text class="heading" x="190" y="525">Black-Box Detector</text>
    <rect class="softPurple" x="108" y="544" width="164" height="66" rx="16"/>
    <text class="heading" x="190" y="585">f(·)</text>
    <path class="flow" d="M273 577H309"/>
    <text class="small" x="292" y="556">s, A</text>

    <text class="heading" x="190" y="654">Query and Edit Budgets</text>
    <rect class="softBlue" x="70" y="674" width="105" height="67" rx="16"/>
    <rect class="softYellow" x="205" y="674" width="105" height="67" rx="16"/>
    <text class="heading" x="122" y="706">B<tspan baseline-shift="sub" font-size="14">q</tspan></text>
    <text class="tiny" x="122" y="730">queries</text>
    <text class="heading" x="258" y="706">B<tspan baseline-shift="sub" font-size="14">e</tspan></text>
    <text class="tiny" x="258" y="730">edits</text>
  </g>

  <!-- Stage 2: target and state -->
  <g>
    <rect class="card" x="420" y="28" width="960" height="255" rx="28"/>
    <circle cx="458" cy="66" r="24" fill="#ff8787" stroke="#202124" stroke-width="2.5"/>
    <text class="step" x="458" y="67">2</text>
    <text class="title" x="900" y="72">Target and State Construction</text>
    <rect class="softPurple" x="702" y="91" width="396" height="38" rx="19"/>
    <text class="text" x="900" y="117">observable anomaly scores and alerts</text>

    <rect class="softYellow" x="455" y="148" width="205" height="105" rx="18"/>
    <circle cx="557" cy="184" r="13" fill="none" stroke="#e03131" stroke-width="3"/>
    <circle cx="557" cy="184" r="5" fill="#e03131"/>
    <path class="line" d="M557 197V210"/>
    <text class="small" x="557" y="235">Target selection</text>

    <rect class="softBlue" x="680" y="148" width="205" height="105" rx="18"/>
    <g transform="translate(726 177)"><rect x="0" y="0" width="22" height="22" fill="#74c0fc" stroke="#202124" stroke-width="2"/><rect x="22" y="0" width="22" height="22" fill="#fff" stroke="#202124" stroke-width="2"/><rect x="44" y="0" width="22" height="22" fill="#8ce99a" stroke="#202124" stroke-width="2"/><rect x="66" y="0" width="22" height="22" fill="#fff" stroke="#202124" stroke-width="2"/></g>
    <text class="small" x="782" y="235">State encoding</text>

    <rect class="softGreen" x="905" y="148" width="205" height="105" rx="18"/>
    <g transform="translate(964 170)"><ellipse cx="42" cy="30" rx="41" ry="26" fill="none" stroke="#202124" stroke-width="2" stroke-dasharray="5 4"/><path class="line" d="M11 34L39 12L72 29M39 12L51 50"/><circle class="node" cx="11" cy="34" r="6"/><circle class="blue" cx="39" cy="12" r="7"/><circle class="node" cx="72" cy="29" r="6"/><circle class="green" cx="51" cy="50" r="6"/></g>
    <text class="small" x="1007" y="235">Candidate pool</text>

    <rect class="softPurple" x="1130" y="148" width="215" height="105" rx="18"/>
    <g transform="translate(1211 168)"><rect x="0" y="0" width="54" height="54" fill="#fff" stroke="#202124" stroke-width="2"/><path class="line" d="M18 0V54M36 0V54M0 18H54M0 36H54"/><rect x="2" y="2" width="14" height="14" fill="#b197fc"/><rect x="20" y="20" width="14" height="14" fill="#b197fc"/><rect x="38" y="38" width="14" height="14" fill="#b197fc"/></g>
    <text class="small" x="1238" y="235">Action mask</text>
  </g>

  <!-- Stage 3: semantic-constrained loop -->
  <g>
    <rect class="card" x="400" y="330" width="1000" height="640" rx="30"/>
    <circle cx="440" cy="370" r="25" fill="#b197fc" stroke="#202124" stroke-width="2.5"/>
    <text class="step" x="440" y="371">3</text>
    <text class="title" x="900" y="378">Semantic-Constrained Attack Loop</text>

    <rect class="softBlue" x="775" y="402" width="250" height="82" rx="18"/>
    <text class="heading" x="900" y="433">Action Decision</text>
    <text class="small" x="900" y="462">LinUCB · DDQN · PPO</text>

    <rect class="softYellow" x="1090" y="490" width="255" height="112" rx="18"/>
    <text class="heading" x="1217" y="521">Macro-Action</text>
    <text class="small" x="1217" y="548">L primitive edits</text>
    <g transform="translate(1147 562)"><circle class="node" cx="0" cy="13" r="7"/><circle class="blue" cx="27" cy="0" r="7"/><path class="line" d="M6 9L21 3M34 3L49 11"/><path class="loop" d="M63 7H94"/><circle class="green" cx="113" cy="0" r="7"/><circle class="node" cx="143" cy="13" r="7"/><path class="line" d="M120 4L137 10"/></g>

    <rect class="softGreen" x="1090" y="690" width="255" height="112" rx="18"/>
    <text class="heading" x="1217" y="721">Semantic Validation</text>
    <text class="small" x="1217" y="751">type · event · direction</text>
    <circle cx="1217" cy="778" r="14" fill="#51cf66" stroke="#202124" stroke-width="2"/>
    <path d="M1209 778L1215 784L1226 771" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

    <rect class="softPurple" x="775" y="825" width="250" height="92" rx="18"/>
    <text class="heading" x="900" y="855">Graph Modification</text>
    <g transform="translate(828 873)"><circle class="node" cx="0" cy="8" r="7"/><circle class="blue" cx="30" cy="0" r="7"/><circle class="node" cx="60" cy="8" r="7"/><path class="line" d="M6 5L24 2M36 2L54 5"/><path class="loop" d="M72 7H105"/><circle class="green" cx="124" cy="7" r="7"/></g>

    <rect class="softBlue" x="455" y="690" width="255" height="112" rx="18"/>
    <text class="heading" x="582" y="721">Detector Query</text>
    <rect x="542" y="745" width="80" height="42" rx="10" fill="#fff" stroke="#202124" stroke-width="2.5"/>
    <text class="heading" x="582" y="773">f(·)</text>
    <path class="loop" d="M624 766H668"/>
    <text class="small" x="675" y="748">s, A</text>

    <rect class="softYellow" x="455" y="490" width="255" height="112" rx="18"/>
    <text class="heading" x="582" y="521">Feedback and Update</text>
    <text class="small" x="582" y="550">score change · threshold</text>
    <text class="small" x="582" y="576">indirect effect · edit cost</text>

    <circle cx="900" cy="642" r="86" fill="#fff" stroke="#202124" stroke-width="3" stroke-dasharray="8 6"/>
    <text class="heading" x="900" y="625">Iterative</text>
    <text class="heading" x="900" y="653">Black-Box</text>
    <text class="heading" x="900" y="681">Feedback</text>

    <path class="loop" d="M1025 443C1065 443 1080 462 1090 500"/>
    <path class="loop" d="M1217 602V684"/>
    <path class="loop" d="M1090 750C1060 806 1036 856 1027 868"/>
    <path class="loop" d="M775 870C740 870 717 805 706 760"/>
    <path class="loop" d="M582 690V608"/>
    <path class="loop" d="M710 535C748 480 760 453 773 445"/>

    <rect x="730" y="930" width="340" height="28" rx="14" fill="#fff" stroke="#202124" stroke-width="2"/>
    <text class="tiny" x="900" y="950">stop when the target evades or the budget expires</text>
  </g>

  <!-- Stage 4: evaluation -->
  <g>
    <rect class="card" x="1470" y="260" width="305" height="510" rx="28"/>
    <circle cx="1508" cy="298" r="24" fill="#69db7c" stroke="#202124" stroke-width="2.5"/>
    <text class="step" x="1508" y="299">4</text>
    <text class="title" x="1620" y="308">Evaluation</text>

    <rect class="softGreen" x="1500" y="345" width="245" height="150" rx="18"/>
    <text class="heading" x="1622" y="384">Attack Success Rate ↑</text>
    <text class="heading" x="1622" y="430">Average Budget ↓</text>
    <text class="heading" x="1622" y="476">Average Query Time ↓</text>

    <text class="heading" x="1622" y="520">Adversarial Graph</text>
    <g transform="translate(1534 540)">
      <path class="line" d="M12 54L55 17L101 50L146 8M55 17L72 95L122 87M101 50L122 87L174 52"/>
      <circle class="blue" cx="12" cy="54" r="9"/><circle class="node" cx="55" cy="17" r="9"/>
      <circle class="green" cx="101" cy="50" r="9"/><circle class="node" cx="146" cy="8" r="9"/>
      <circle class="node" cx="72" cy="95" r="9"/><circle class="yellow" cx="122" cy="87" r="9"/>
      <circle class="node" cx="174" cy="52" r="9"/>
    </g>
    <path class="line" d="M1518 735V665M1518 735H1725"/>
    <rect x="1550" y="705" width="20" height="30" fill="#74c0fc" stroke="#202124" stroke-width="2"/>
    <rect x="1594" y="684" width="20" height="51" fill="#ffe066" stroke="#202124" stroke-width="2"/>
    <rect x="1638" y="655" width="20" height="80" fill="#8ce99a" stroke="#202124" stroke-width="2"/>
    <text class="heading" x="1695" y="718">···</text>
  </g>

  <!-- Stage transitions -->
  <path class="flow" d="M355 350C388 326 390 237 418 205"/>
  <text class="small" x="382" y="300">observable output</text>
  <path class="flow" d="M900 283V324"/>
  <text class="small" x="975" y="312">state and valid actions</text>
  <path class="flow" d="M1400 575H1463"/>
  <text class="small" x="1432" y="552">attack result</text>
</svg>
