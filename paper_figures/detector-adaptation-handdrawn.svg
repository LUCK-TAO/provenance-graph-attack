<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Detector adaptation in a hand-drawn interaction style</title>
  <desc id="desc">A detector adapter connects a provenance graph, a native detector, a unified black-box interface, and shared attack logic in a closed feedback loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#202124"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#202124"/>
    </marker>
    <style>
      .bg{fill:#fff}.card{fill:#fff;stroke:#202124;stroke-width:4}
      .title{font:700 31px 'Comic Sans MS','Segoe Print',sans-serif;fill:#202124;text-anchor:middle}
      .subtitle{font:22px 'Comic Sans MS','Segoe Print',sans-serif;fill:#343a40;text-anchor:middle}
      .label{font:700 22px 'Comic Sans MS','Segoe Print',sans-serif;fill:#202124;text-anchor:middle}
      .small{font:18px 'Comic Sans MS','Segoe Print',sans-serif;fill:#343a40;text-anchor:middle}
      .tiny{font:16px 'Comic Sans MS','Segoe Print',sans-serif;fill:#343a40;text-anchor:middle}
      .step{font:700 19px 'Comic Sans MS','Segoe Print',sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .line{fill:none;stroke:#202124;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:#202124;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .flowSmall{fill:none;stroke:#202124;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowSmall)}
      .node{fill:#fff;stroke:#202124;stroke-width:2.5}.nodeBlue{fill:#74c0fc;stroke:#202124;stroke-width:2.5}
      .nodeGreen{fill:#8ce99a;stroke:#202124;stroke-width:2.5}.nodeYellow{fill:#ffe066;stroke:#202124;stroke-width:2.5}
      .mini{fill:#fff;stroke:#202124;stroke-width:3}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <!-- Native detector -->
  <g>
    <rect class="card" x="560" y="40" width="480" height="178" rx="26"/>
    <circle cx="595" cy="75" r="22" fill="#ff8787" stroke="#202124" stroke-width="2.5"/>
    <text class="step" x="595" y="76">2</text>
    <text class="title" x="800" y="84">Native Detector</text>
    <g transform="translate(664 111)">
      <rect x="0" y="0" width="82" height="58" rx="8" fill="#fff3bf" stroke="#202124" stroke-width="2.5"/>
      <path class="line" d="M16 15H65M16 29H55M16 43H62"/>
      <path class="line" d="M-10 12H0M-10 29H0M-10 46H0M82 12H92M82 29H92M82 46H92"/>
      <circle cx="104" cy="29" r="18" fill="#ff8787" stroke="#202124" stroke-width="2.5"/>
      <path class="line" d="M96 29H112M104 21V37"/>
    </g>
    <text class="small" x="910" y="135">detector-specific</text>
    <text class="small" x="910" y="162">inference</text>
    <text class="tiny" x="890" y="197">native architecture and scoring</text>
  </g>

  <!-- Provenance graph -->
  <g>
    <rect class="card" x="55" y="286" width="390" height="280" rx="26"/>
    <circle cx="90" cy="321" r="22" fill="#74c0fc" stroke="#202124" stroke-width="2.5"/>
    <text class="step" x="90" y="322">1</text>
    <text class="title" x="250" y="331">Provenance Graph</text>
    <g transform="translate(112 367)">
      <path class="line" d="M20 78L82 28L145 72L211 20M82 28L106 137L177 119M145 72L177 119L244 74"/>
      <circle class="nodeBlue" cx="20" cy="78" r="13"/><circle class="node" cx="82" cy="28" r="13"/>
      <circle class="nodeGreen" cx="145" cy="72" r="13"/><circle class="node" cx="211" cy="20" r="13"/>
      <circle class="node" cx="106" cy="137" r="13"/><circle class="nodeYellow" cx="177" cy="119" r="13"/>
      <circle class="node" cx="244" cy="74" r="13"/>
    </g>
    <rect x="112" y="525" width="276" height="36" rx="18" fill="#e7f5ff" stroke="#202124" stroke-width="2"/>
    <text class="small" x="250" y="550">original or modified G<tspan baseline-shift="sub" font-size="14">t</tspan></text>
  </g>

  <!-- Central adapter -->
  <g>
    <rect class="card" x="555" y="305" width="490" height="280" rx="34" fill="#fff"/>
    <text class="title" x="800" y="354">Detector Adapter</text>
    <g transform="translate(752 374)">
      <circle cx="48" cy="48" r="42" fill="#d0bfff" stroke="#202124" stroke-width="2.8"/>
      <circle cx="48" cy="48" r="14" fill="#fff" stroke="#202124" stroke-width="2.5"/>
      <path class="line" d="M48 0V17M48 79V96M0 48H17M79 48H96M14 14L26 26M70 70L82 82M82 14L70 26M26 70L14 82"/>
      <path d="M13 70L76 7" stroke="#20c997" stroke-width="13" stroke-linecap="round"/>
      <path d="M13 70L76 7" stroke="#202124" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M8 75L20 63L27 70L15 82Z" fill="#ffe066" stroke="#202124" stroke-width="2"/>
    </g>
    <g>
      <rect class="mini" x="585" y="500" width="130" height="55" rx="14"/>
      <rect class="mini" x="735" y="500" width="130" height="55" rx="14"/>
      <rect class="mini" x="885" y="500" width="130" height="55" rx="14"/>
      <text class="tiny" x="650" y="523">Graph</text><text class="tiny" x="650" y="545">conversion</text>
      <text class="tiny" x="800" y="523">Native</text><text class="tiny" x="800" y="545">query</text>
      <text class="tiny" x="950" y="523">Output</text><text class="tiny" x="950" y="545">mapping</text>
      <path class="flowSmall" d="M715 528H730"/><path class="flowSmall" d="M865 528H880"/>
    </g>
  </g>

  <!-- Unified response -->
  <g>
    <rect class="card" x="1155" y="286" width="390" height="280" rx="26"/>
    <circle cx="1190" cy="321" r="22" fill="#69db7c" stroke="#202124" stroke-width="2.5"/>
    <text class="step" x="1190" y="322">3</text>
    <text class="title" x="1350" y="318">Unified Black-Box</text>
    <text class="title" x="1350" y="352">Interface</text>
    <g transform="translate(1205 382)">
      <rect x="0" y="0" width="290" height="132" rx="18" fill="#ebfbee" stroke="#202124" stroke-width="2.3"/>
      <circle cx="34" cy="34" r="10" fill="#74c0fc" stroke="#202124" stroke-width="2"/>
      <path class="line" d="M58 34H252"/><text class="small" x="157" y="26">anomaly scores</text>
      <path d="M25 68L33 76L46 60" fill="none" stroke="#2f9e44" stroke-width="5" stroke-linecap="round"/>
      <text class="small" x="157" y="75">alerted nodes</text>
      <path class="line" d="M24 107H47M36 94V120"/><text class="small" x="157" y="112">detection threshold</text>
    </g>
    <text class="tiny" x="1350" y="545">detector-independent response</text>
  </g>

  <!-- Shared attack logic -->
  <g>
    <rect class="card" x="525" y="675" width="550" height="180" rx="26"/>
    <circle cx="560" cy="710" r="22" fill="#ffd43b" stroke="#202124" stroke-width="2.5"/>
    <text class="step" x="560" y="711">4</text>
    <text class="title" x="800" y="722">Shared Attack Logic</text>
    <g>
      <rect x="555" y="750" width="150" height="68" rx="17" fill="#fff3bf" stroke="#202124" stroke-width="2"/>
      <rect x="725" y="750" width="150" height="68" rx="17" fill="#e7f5ff" stroke="#202124" stroke-width="2"/>
      <rect x="895" y="750" width="150" height="68" rx="17" fill="#ebfbee" stroke="#202124" stroke-width="2"/>
      <circle cx="630" cy="773" r="10" fill="none" stroke="#e03131" stroke-width="3"/><circle cx="630" cy="773" r="4" fill="#e03131"/>
      <path class="line" d="M630 783V792"/>
      <path d="M790 765L809 775L790 785Z" fill="#74c0fc" stroke="#202124" stroke-width="2"/>
      <path d="M966 765C952 765 948 784 960 790H974C986 784 982 765 966 765Z" fill="#ffe066" stroke="#202124" stroke-width="2"/>
      <path class="line" d="M960 796H974"/>
      <text class="tiny" x="630" y="812">Target selection</text>
      <text class="tiny" x="800" y="812">Action decision</text>
      <text class="tiny" x="970" y="812">Reward &amp; update</text>
    </g>
  </g>

  <!-- Interaction arrows -->
  <path class="flow" d="M445 426C490 426 510 426 548 426"/>
  <text class="small" x="500" y="406">graph</text>

  <path class="flowSmall" d="M735 305C706 274 700 246 720 220"/>
  <text class="tiny" x="665" y="265">query</text>
  <path class="flowSmall" d="M880 220C902 248 895 278 864 305"/>
  <text class="tiny" x="938" y="264">native output</text>

  <path class="flow" d="M1045 426C1085 426 1105 426 1148 426"/>
  <text class="small" x="1100" y="406">standardized feedback</text>

  <path class="flow" d="M1350 566C1320 640 1190 696 1080 730"/>
  <text class="small" x="1245" y="650">observe and learn</text>

  <path class="flow" d="M525 770C430 760 392 666 414 574"/>
  <text class="small" x="400" y="705">next modified graph</text>
</svg>
