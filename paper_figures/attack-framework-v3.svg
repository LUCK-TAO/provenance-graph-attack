<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="820" viewBox="0 0 2000 820" role="img" aria-labelledby="title desc">
  <title id="title">Limited-feedback black-box attack framework</title>
  <desc id="desc">Four-stage workflow covering attack setup, target and state construction, a semantic-constrained attack loop, and evaluation.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.group{fill:#fff;stroke:#111;stroke-width:2;stroke-dasharray:8 6}.panel{fill:#fff;stroke:#555;stroke-width:1.6}.head{fill:#e8e8e8;stroke:#555;stroke-width:1.5}.stage{font:700 27px Georgia,'Times New Roman',serif;fill:#111}.h{font:700 19px Georgia,'Times New Roman',serif;fill:#111}.t{font:16px Georgia,'Times New Roman',serif;fill:#111}.s{font:14px Georgia,'Times New Roman',serif;fill:#111}.scoreval{font:600 15px Arial,Helvetica,sans-serif;fill:#111;font-variant-numeric:tabular-nums;letter-spacing:.15px}.metric{font:700 23px Georgia,'Times New Roman',serif;fill:#111}.evalmetric{font:700 18px Georgia,'Times New Roman',serif;fill:#111}.blue{fill:#888;stroke:#111;stroke-width:1.8}.node{fill:#fff;stroke:#111;stroke-width:2}.alert{fill:#fff;stroke:#111;stroke-width:4}.line{fill:none;stroke:#111;stroke-width:2}.flow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)}.flowMini{fill:none;stroke:#111;stroke-width:2;marker-end:url(#arrowSmall)}.flowExit{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrowSmall)}.feedback{fill:none;stroke:#111;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#arrowBlue)}.dash{fill:none;stroke:#555;stroke-width:1.5;stroke-dasharray:6 5}.circle{fill:#333;stroke:#111;stroke-width:2}.num{font:700 28px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.center{text-anchor:middle}.smallbox{fill:#f3f3f3;stroke:#666;stroke-width:1.5}.diamond{fill:#fff;stroke:#111;stroke-width:2}.muted{fill:#555}.bar{fill:#777;stroke:#111;stroke-width:1.2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
  </defs>
  <rect class="bg" width="2000" height="820"/>

  <!-- Stage 1 -->
  <g transform="translate(20 30)">
    <rect class="group" width="300" height="750" rx="22"/>
    <circle class="circle" cx="42" cy="42" r="27"/><text class="num" x="42" y="43">1</text>
    <text class="stage" x="88" y="51">Attack Setup</text>
    <rect class="panel" x="18" y="85" width="264" height="645" rx="10"/>
    <text class="h center" x="150" y="113">Test Provenance Graph</text>
    <g transform="translate(52 128)">
      <path class="line" d="M20 72L75 32L126 66L172 21M75 32L95 104L150 98M126 66L150 98L206 70"/>
      <circle class="blue" cx="20" cy="72" r="10"/><circle class="node" cx="75" cy="32" r="10"/><circle class="blue" cx="126" cy="66" r="10"/><circle class="node" cx="172" cy="21" r="10"/><circle class="node" cx="95" cy="104" r="10"/><circle class="blue" cx="150" cy="98" r="10"/><circle class="node" cx="206" cy="70" r="10"/>
    </g>
    <text class="h" x="34" y="283">Black-Box Detector</text>
    <g transform="translate(72 310)">
      <path class="line" d="M0 48H28M151 48H182" marker-end="url(#arrow)"/>
      <path d="M28 21H136L151 34V92H28Z" fill="#f4f4f4" stroke="#111" stroke-width="2"/><path d="M28 21L44 8H148L136 21" fill="#fff" stroke="#111" stroke-width="2"/>
      <text class="h center" x="88" y="62">f(·)</text><text class="t center" x="166" y="29">s, A</text>
    </g>
    <text class="h" x="34" y="438">MAGIC / FLASH</text>
    <g transform="translate(100 458)"><rect x="0" y="0" width="75" height="92" fill="#fff" stroke="#111" stroke-width="2"/><path class="line" d="M14 19H58M14 35H58M14 51H50M14 67H42"/><circle cx="76" cy="74" r="24" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="76" cy="74" r="9" fill="#fff" stroke="#111" stroke-width="2"/></g>
    <text class="h center" x="150" y="585">Query and Edit Budgets</text>
    <rect class="smallbox" x="42" y="610" width="92" height="92" rx="9"/><rect class="smallbox" x="166" y="610" width="92" height="92" rx="9"/>
    <text class="h center" x="88" y="649">B<tspan baseline-shift="sub" font-size="13">q</tspan></text><text class="s center" x="88" y="679">queries</text>
    <text class="h center" x="212" y="649">B<tspan baseline-shift="sub" font-size="13">e</tspan></text><text class="s center" x="212" y="679">edits</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(360 30)">
    <rect class="group" width="350" height="750" rx="22"/>
    <circle class="circle" cx="42" cy="42" r="27"/><text class="num" x="42" y="43">2</text>
    <text class="stage" x="84" y="41">Target and State</text><text class="stage" x="84" y="70">Construction</text>
    <rect class="panel" x="18" y="92" width="314" height="198" rx="10"/><rect class="head" x="18" y="92" width="314" height="34" rx="10"/>
    <text class="h center" x="175" y="116">Observable Outputs Only</text>
    <rect class="smallbox" x="42" y="137" width="266" height="34" rx="7"/><text class="h center" x="175" y="160">Anomaly Scores + Alerts</text>
    <text class="s center" x="93" y="198">Node</text><text class="s center" x="177" y="198">Score</text><text class="s center" x="265" y="198">Alert</text>
    <circle class="node" cx="93" cy="219" r="7"/><text class="scoreval center" x="177" y="224">0.12</text><text class="s center" x="265" y="224">–</text>
    <circle class="blue" cx="93" cy="243" r="7"/><text class="scoreval center" x="177" y="248">0.87</text><text class="s center" x="265" y="248">!</text>
    <circle class="node" cx="93" cy="267" r="7"/><text class="scoreval center" x="177" y="272">0.43</text><text class="s center" x="265" y="272">–</text>
    <rect class="panel" x="18" y="304" width="314" height="171" rx="10"/><rect class="head" x="18" y="304" width="314" height="34" rx="10"/>
    <text class="h center" x="175" y="328">Target Selection</text>
    <g transform="translate(64 352)"><path class="line" d="M15 66L66 25L111 62L163 31L205 70M66 25L95 105M111 62L95 105"/><circle class="node" cx="15" cy="66" r="9"/><circle class="blue" cx="66" cy="25" r="10"/><circle class="blue" cx="111" cy="62" r="10"/><circle class="alert" cx="163" cy="31" r="12"/><circle class="blue" cx="205" cy="70" r="10"/><circle class="node" cx="95" cy="105" r="9"/><text class="s" x="181" y="20">Target Node</text></g>
    <rect class="panel" x="18" y="489" width="314" height="72" rx="10"/><rect class="head" x="18" y="489" width="314" height="31" rx="10"/><text class="h center" x="175" y="512">State Encoding</text>
    <g transform="translate(88 530)"><rect class="blue" x="0" y="0" width="24" height="20"/><rect class="node" x="24" y="0" width="24" height="20"/><rect class="blue" x="48" y="0" width="24" height="20"/><rect class="node" x="72" y="0" width="24" height="20"/><rect class="blue" x="96" y="0" width="24" height="20"/><text class="h" x="136" y="17">···</text></g>
    <rect class="panel" x="18" y="576" width="152" height="154" rx="10"/><rect class="head" x="18" y="576" width="152" height="31" rx="10"/><text class="h center" x="94" y="599">Candidate Pool</text><text class="s center" x="94" y="626">2-Hop + Global</text>
    <g transform="translate(40 642)"><ellipse class="dash" cx="54" cy="42" rx="52" ry="36"/><path class="line" d="M14 48L51 18L92 39M51 18L68 67M68 67L96 59"/><circle class="node" cx="14" cy="48" r="7"/><circle class="blue" cx="51" cy="18" r="8"/><circle class="node" cx="92" cy="39" r="7"/><circle class="blue" cx="68" cy="67" r="7"/><circle class="node" cx="96" cy="59" r="7"/></g>
    <rect class="panel" x="180" y="576" width="152" height="154" rx="10"/><rect class="head" x="180" y="576" width="152" height="31" rx="10"/><text class="h center" x="256" y="599">Action Mask</text>
    <g transform="translate(218 630)"><rect x="0" y="0" width="76" height="76" fill="#fff" stroke="#111" stroke-width="2"/><path class="line" d="M19 0V76M38 0V76M57 0V76M0 19H76M0 38H76M0 57H76"/><rect x="2" y="2" width="16" height="16" fill="#777"/><rect x="40" y="21" width="16" height="16" fill="#777"/><rect x="21" y="40" width="16" height="16" fill="#777"/><rect x="59" y="59" width="15" height="15" fill="#777"/></g>
  </g>

  <!-- Stage transitions -->
  <path class="flow" d="M320 390H352"/><path class="flow" d="M710 390H740"/>

  <!-- Stage 3 -->
  <g transform="translate(740 30)">
    <rect class="group" width="820" height="750" rx="22"/>
    <circle class="circle" cx="42" cy="42" r="27"/><text class="num" x="42" y="43">3</text>
    <text class="stage" x="86" y="51">Semantic-Constrained Attack Loop</text>

    <rect class="panel" x="255" y="96" width="310" height="82" rx="10"/><rect class="head" x="255" y="96" width="310" height="31" rx="10"/><text class="h center" x="410" y="119">Action Decision</text><text class="t center" x="410" y="152">LinUCB / DDQN / PPO / Heuristics</text>

    <rect class="panel" x="40" y="215" width="275" height="132" rx="10"/><rect class="head" x="40" y="215" width="275" height="31" rx="10"/><text class="h center" x="178" y="238">Feedback and Update</text><text class="s" x="58" y="268">Score Change</text><text class="s" x="58" y="290">Threshold Crossing</text><text class="s" x="58" y="312">Indirect Effect</text><text class="s" x="58" y="334">Edit Cost</text><rect class="bar" x="242" y="306" width="11" height="28"/><rect class="bar" x="258" y="282" width="11" height="52"/><rect class="bar" x="274" y="257" width="11" height="77"/>

    <rect class="panel" x="505" y="215" width="275" height="132" rx="10"/><rect class="head" x="505" y="215" width="275" height="31" rx="10"/><text class="h center" x="643" y="238">Macro-Action</text><text class="t center" x="643" y="270">L Primitive Edits</text>
    <g transform="translate(540 292)"><circle class="node" cx="0" cy="18" r="9"/><circle class="blue" cx="34" cy="0" r="9"/><path class="line" d="M7 13L27 5M41 4L61 17"/><path class="flow" d="M82 9H126"/><circle class="blue" cx="157" cy="0" r="9"/><circle class="node" cx="199" cy="18" r="9"/><path class="line" d="M164 5L192 14"/></g>

    <ellipse cx="410" cy="385" rx="94" ry="46" fill="#f3f3f3" stroke="#666" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="h center" x="410" y="381">Iterative Black-Box</text><text class="h center" x="410" y="405">Feedback</text>

    <rect class="panel" x="40" y="420" width="275" height="122" rx="10"/><rect class="head" x="40" y="420" width="275" height="31" rx="10"/><text class="h center" x="178" y="443">Detector Query</text>
    <g transform="translate(69 469)"><circle class="node" cx="0" cy="21" r="8"/><circle class="blue" cx="32" cy="0" r="8"/><circle class="node" cx="64" cy="21" r="8"/><path class="line" d="M7 16L25 6M39 6L57 16"/><path d="M99 0H152V44H99Z" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text class="t center" x="125" y="28">f(·)</text><path class="flowMini" d="M73 21H96M155 21H184"/><text class="s" x="194" y="26">s, A</text></g>

    <rect class="panel" x="505" y="420" width="275" height="122" rx="10"/><rect class="head" x="505" y="420" width="275" height="31" rx="10"/><text class="h center" x="643" y="443">Semantic Validation</text><text class="s center" x="643" y="478">Node Type · Edge Type · Direction</text><circle cx="643" cy="513" r="15" fill="#555" stroke="#111" stroke-width="1.5"/><path d="M635 513L641 519L652 506" fill="none" stroke="#fff" stroke-width="3"/>

    <rect class="panel" x="285" y="545" width="250" height="75" rx="10"/><rect class="head" x="285" y="545" width="250" height="30" rx="10"/><text class="h center" x="410" y="568">Graph Modification</text><g transform="translate(326 584)"><circle class="node" cx="0" cy="12" r="8"/><circle class="blue" cx="40" cy="0" r="8"/><circle class="node" cx="80" cy="12" r="8"/><path class="line" d="M7 9L33 3M47 3L73 9"/><path class="line" stroke-dasharray="4 3" d="M89 10H137" marker-end="url(#arrow)"/><circle class="node" cx="159" cy="10" r="8"/></g>

    <path class="diamond" d="M410 655L530 702L410 749L290 702Z"/><text class="h center" x="410" y="697">Target Evaded</text><text class="h center" x="410" y="721">or Budget Exhausted?</text>

    <path class="flow" d="M565 137C617 137 659 166 680 212"/>
    <path class="flow" d="M643 347V417"/>
    <path class="flow" d="M643 542C616 563 574 583 538 584"/>
    <path class="flow" d="M282 584C240 584 196 561 178 545"/>
    <path class="flow" d="M178 420V350"/>
    <path class="flow" d="M315 280C337 247 352 210 370 180"/>
    <path class="flow" d="M410 620V652"/>
    <path class="feedback" d="M290 702H20V144H252"/><text class="h" x="235" y="687">No</text>
  </g>
  <path class="feedback" d="M780 282C744 282 724 321 700 352"/>
  <path class="flowExit" d="M1270 732H1545V390H1596"/><text class="h" x="1284" y="717">Yes</text>

  <!-- Stage 4 -->
  <g transform="translate(1600 30)">
    <rect class="group" width="380" height="750" rx="22"/>
    <circle class="circle" cx="42" cy="42" r="27"/><text class="num" x="42" y="43">4</text><text class="stage" x="86" y="51">Evaluation</text>
    <rect class="panel" x="24" y="92" width="332" height="194" rx="10"/>
    <text class="evalmetric" x="52" y="147">Attack Success Rate ↑</text><text class="evalmetric" x="52" y="201">Average Attack Budget ↓</text><text class="evalmetric" x="52" y="255">Average Query Time ↓</text>
    <rect class="panel" x="24" y="320" width="332" height="390" rx="10"/><rect class="head" x="24" y="320" width="332" height="63" rx="10"/>
    <text class="h center" x="190" y="346">Adversarial Provenance</text><text class="h center" x="190" y="372">Graph + Attack Metrics</text>
    <g transform="translate(78 412)"><path class="line" d="M20 80L74 35L124 74L173 24M74 35L91 119L146 110M124 74L146 110L211 75"/><circle class="node" cx="20" cy="80" r="11"/><circle class="blue" cx="74" cy="35" r="11"/><circle class="blue" cx="124" cy="74" r="11"/><circle class="node" cx="173" cy="24" r="11"/><circle class="node" cx="91" cy="119" r="11"/><circle class="blue" cx="146" cy="110" r="11"/><circle class="node" cx="211" cy="75" r="11"/></g>
    <text class="h" x="55" y="588">Attack Metrics</text><path class="line" d="M62 678V612M62 678H315"/><rect class="bar" x="90" y="650" width="18" height="28"/><rect class="bar" x="130" y="625" width="18" height="53"/><rect class="bar" x="170" y="602" width="18" height="76"/><text class="h" x="224" y="660">···</text>
  </g>
</svg>
